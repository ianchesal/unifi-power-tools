# Fixed project name: container, network and volume names (unifi-power-tools_data)
# stay the same whatever folder the repo is cloned into, so `docker compose`
# never needs -p.
name: unifi-power-tools

services:
  unifi-power-tools:
    build: .
    image: unifi-power-tools:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false # locally built image
    ports:
      # Dashboard, /api, /mcp, /health. LAN only: never publish this to the internet.
      - "3002:3002"
      # Syslog from the UniFi gateway (point its SIEM server setting at this host:5514).
      - "5514:10514/udp"
    env_file:
      - .env
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - proxy

volumes:
  data:

networks:
  default:
  proxy:
    external: true
